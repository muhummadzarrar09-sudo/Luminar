##
## Version catalog for Recto.
##
## Every version lives here, nowhere else. Verified against the July 2026
## release pages; see docs/BUILD_SETUP.md for the reasoning behind each pin.
##
## Deliberately absent: org.jetbrains.kotlin.android.
## AGP 9 has built-in Kotlin. Applying the old plugin fails with
## "Cannot add extension with name 'kotlin'". That is the trap the previous
## project worked around with android.builtInKotlin=false, a flag that is now
## deprecated and stops working in AGP 10.
##
## Phase 0 keeps this list minimal on purpose. Room, Hilt, KSP, Readium and
## androidx.pdf all arrive in Phase 1, once a green build exists to add them to.
##

[versions]
agp = "9.3.0"                    # needs Gradle 9.5.0, JDK 17, build-tools 36
kotlin = "2.3.21"                # Compose compiler plugin version must match

composeBom = "2026.06.01"
activityCompose = "1.13.0"
coreKtx = "1.17.0"
lifecycle = "2.10.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
