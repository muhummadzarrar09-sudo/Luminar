# Recto - Gradle configuration
#
# Note what is NOT here, compared to the previous project:
#
#   android.builtInKotlin=false
#   android.newDsl=false
#
# Those were a genuine workaround for KSP being incompatible with AGP 9's
# built-in Kotlin. That is fixed (KSP 2.3.1+, Hilt 2.59+), and both flags are
# deprecated and removed in AGP 10. We start clean instead of inheriting them.
#
# Also absent: org.gradle.java.home. Your JDK 17 is already on PATH, so
# hardcoding an absolute Windows path into a committed file would only break
# things for other machines. If a pin is ever needed it goes in
# local.properties, which is git-ignored.

org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Configuration cache is deliberately OFF for Phase 0. It works with AGP 9, but
# it turns unrelated plugin problems into confusing serialization errors, and
# the goal right now is a clean first build. Turn it on once we are green:
# org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
