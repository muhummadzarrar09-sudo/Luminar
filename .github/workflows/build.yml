name: build

# Compiles the debug APK on every push and uploads it as a downloadable
# artifact. This exists because the code is authored in an environment with
# no JDK and no Android SDK - CI is the only thing that actually compiles it
# before it reaches a phone.

on:
  push:
    branches: [ "arena/019f9f64-luminar" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push cancels an in-flight run of the same branch. No point burning
# five minutes compiling a commit that has already been superseded.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # gradle-version is specified deliberately. gradle-wrapper.jar is a
      # binary and is not committed to this repo, so ./gradlew does not exist
      # on a fresh clone. Installing Gradle directly means CI does not depend
      # on the wrapper at all, and the `gradle` command below works.
      #
      # 9.5.0 is AGP 9.3.0's minimum. Keep it in step with
      # gradle/wrapper/gradle-wrapper.properties.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      # The runner image ships an Android SDK, but not necessarily API 36.
      # Accepting licences lets AGP fetch whatever platform and build-tools
      # it still needs. `|| true` because sdkmanager exits non-zero when
      # every licence is already accepted, which is not a failure.
      - name: Accept Android SDK licences
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Assemble debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      # Runs even when the build fails, so a broken compile still tells you
      # what it managed to produce.
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: recto-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
